<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Job Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --header-bg: #1e293b;
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --header-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background-color 0.2s ease, color 0.2s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #theme-toggle {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s;
        }

        #theme-toggle:hover {
            background: var(--border-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        h1, h2, h3 {
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input[type="file"] {
            color: var(--text-color);
        }

        button.btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            width: fit-content;
            transition: background-color 0.2s;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        .results-container {
            margin-top: 1.5rem;
        }

        .job-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .job-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .job-score {
            background-color: var(--primary-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .spinner {
            display: none;
            margin-left: 0.5rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2px solid #fff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
            }
    </style>
</head>
<body>
    <header>
        <div class="header-title">Agentic Job Tracker</div>
        <div class="header-actions">
            <button id="theme-toggle" aria-label="Toggle light/dark theme">
                <span id="theme-icon">☀️</span> <span id="theme-text">Light Mode</span>
            </button>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Upload Resume</h2>
            <p>Upload your resume PDF to find suitable jobs tailored to your background.</p>
            <div class="upload-section">
                <input type="file" id="resume-file" accept=".pdf">
                <button class="btn" id="analyze-btn">
                    Analyze Jobs
                    <span class="spinner" id="loading-spinner"></span>
                </button>
            </div>
        </div>

        <div class="card results-container">
            <h2>Analysis Results</h2>
            <div id="results-list">
                <p>No analysis run yet. Upload a resume and click Analyze Jobs.</p>
            </div>
        </div>
    </main>
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const body = document.body;

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            if (isLight) {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            } else {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            }
        });

        const analyzeBtn = document.getElementById('analyze-btn');
        const resumeFileInput = document.getElementById('resume-file');
        const loadingSpinner = document.getElementById('loading-spinner');
        const resultsList = document.getElementById('results-list');

        analyzeBtn.addEventListener('click', async () => {
            const file = resumeFileInput.files[0];
            const formData = new FormData();
            if (file) {
                formData.append('resume', file);
            }

            analyzeBtn.disabled = true;
            loadingSpinner.style.display = 'inline-block';
            resultsList.innerHTML = '<p>Analyzing jobs with your resume...</p>';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.analyzed && data.analyzed.length > 0) {
                    resultsList.innerHTML = '';
                    data.analyzed.forEach(job => {
                        const div = document.createElement('div');
                        div.className = 'job-card';
                        div.innerHTML = `
                            <div class="job-header">
                                <span class="job-title">${job.company} - ${job.role}</span>
                                <span class="job-score">${job.score}%</span>
                            </div>
                            <p><strong>Location:</strong> ${job.location || 'N/A'}</p>
                            <p><strong>Reasoning:</strong> ${job.reasoning}</p>
                            <a href="${job.url}" target="_blank">View Job</a>
                        `;
                        resultsList.appendChild(div);
                    });
                } else {
                    resultsList.innerHTML = '<p>No jobs found or an error occurred.</p>';
                }
            } catch (err) {
                resultsList.innerHTML = `<p>Error: ${err.message}</p>`;
            } finally {
                analyzeBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
